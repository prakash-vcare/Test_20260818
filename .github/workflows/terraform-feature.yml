name: Terraform Feature

on:
  push:
    branches:
      - 'feature/**'

  pull_request_review:
    types:
      - submitted

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  TF_WORKING_DIR: ./environment

jobs:

  # ============================================================
  # JOB 1: Terraform Plan on Feature Branch
  # ============================================================
  terraform-plan:
    name: Terraform Format, Validate & Plan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan -input=false


  # ============================================================
  # JOB 2: Create Pull Request
  # ============================================================
  create-pr:
    name: Create Pull Request
    if: github.event_name == 'push'
    needs: terraform-plan
    runs-on: ubuntu-latest

    steps:

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          BRANCH="${{ github.ref_name }}"

          echo "Feature Branch: $BRANCH"

          EXISTING_PR=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then

            echo "Pull Request already exists: #$EXISTING_PR"

          else

            gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head "$BRANCH" \
              --title "Terraform changes: $BRANCH" \
              --body "Terraform Format, Validate and Plan completed successfully.

Please review the Terraform changes and manually approve this Pull Request.

Auto merge will be enabled only after a reviewer approves this Pull Request."

            echo "Pull Request created successfully."

          fi


  # ============================================================
  # JOB 3: Enable Auto Merge ONLY AFTER MANUAL APPROVAL
  # ============================================================
  enable-auto-merge:
    name: Enable Auto Merge After Approval

    if: >
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved'

    runs-on: ubuntu-latest

    steps:

      - name: Verify Pull Request Approval
        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          PR_NUMBER="${{ github.event.pull_request.number }}"

          echo "Checking approval for PR #$PR_NUMBER"

          APPROVALS=$(gh pr view "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --json reviews \
            --jq '[.reviews[] | select(.state == "APPROVED")] | length')

          echo "Number of approvals: $APPROVALS"

          if [ "$APPROVALS" -lt 1 ]; then
            echo "No approved review found."
            exit 1
          fi

          echo "Manual PR approval confirmed."


      - name: Enable Auto Merge
        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          PR_NUMBER="${{ github.event.pull_request.number }}"

          echo "Manual approval received."
          echo "Enabling auto merge for PR #$PR_NUMBER"

          gh pr merge "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --auto \
            --squash

          echo "======================================"
          echo "Auto Merge Enabled"
          echo "PR #$PR_NUMBER"
          echo "======================================"