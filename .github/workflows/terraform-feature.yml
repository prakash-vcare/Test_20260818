name: Terraform PR

on:
  push:
    branches:
      - 'feature/**'

  pull_request_review:
    types:
      - submitted

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  TF_WORKING_DIR: environment

jobs:

  terraform-plan:
    name: Terraform Format, Validate & Plan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false


  create-pr:
    name: Create Pull Request
    needs: terraform-plan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          BRANCH="${{ github.ref_name }}"

          EXISTING_PR=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "Pull Request already exists: #$EXISTING_PR"
          else
            gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head "$BRANCH" \
              --title "Terraform changes: $BRANCH" \
              --body "Terraform Format, Validate and Plan completed successfully. Please review and manually approve this Pull Request. Auto merge will be enabled only after a reviewer approves this Pull Request."

            echo "Pull Request created successfully."
          fi


  auto-merge-after-approval:
    name: Auto Merge After Manual Approval
    if: |
      github.event_name == 'pull_request_review' &&
      github.event.action == 'submitted' &&
      github.event.review.state == 'approved'

    runs-on: ubuntu-latest

    steps:

      - name: Display Approval Information
        run: |
          echo "Manual approval received."
          echo "Reviewer: ${{ github.event.review.user.login }}"
          echo "PR Number: ${{ github.event.pull_request.number }}"
          echo "Review State: ${{ github.event.review.state }}"

      - name: Check PR Status
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"

          STATE=$(gh pr view "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --json state \
            --jq '.state')

          echo "PR State: $STATE"

          if [ "$STATE" != "OPEN" ]; then
            echo "PR is not open."
            exit 1
          fi

      - name: Enable Auto Merge
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"

          echo "Manual approval confirmed."
          echo "Enabling auto merge for PR #$PR_NUMBER"

          gh pr merge "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --auto \
            --squash \
            --delete-branch=false

          echo "Auto merge enabled successfully."
